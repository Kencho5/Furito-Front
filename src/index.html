<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Furito</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no,minimum-scale=1"
    />
    <meta
      name="description"
      content="Furito is your one-stop pet marketplace. Buy, sell, adopt and breed pets. Shop for pet food, clothes, find grooming services and veterinary care for your furry friends."
    />
    <meta
      name="keywords"
      content="pet marketplace, pet adoption, buy pets, sell pets, pet breeding, pet food, pet clothes, vet services, pet grooming, pet care"
    />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Furito - Complete Pet Marketplace" />
    <meta
      property="og:description"
      content="Buy, sell, adopt pets and find everything your pet needs - from food to vet services at Furito."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://furito.com" />
    <meta
      property="og:image"
      content="https://furito.com/assets/images/furito-social.jpg"
    />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Furito - Pet Marketplace & Services" />
    <meta
      name="twitter:description"
      content="Your complete pet marketplace for adoption, shopping and services."
    />
    <meta
      name="twitter:image"
      content="https://furito.com/assets/images/furito-social.jpg"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://furito.com" />

    <link rel="icon" type="image/x-icon" href="favicon.svg" />

    <link
      rel="preload"
      href="assets/fonts/SF-Geo.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="assets/fonts/GEORegular.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="assets/fonts/GEOMedium.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="assets/fonts/GEOBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
