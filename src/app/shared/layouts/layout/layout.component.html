<div
  class="flex min-h-screen flex-col bg-[url('/bgPattern.svg')] bg-top bg-repeat-y"
>
  <app-navbar />

  <main class="flex-grow">
    @if (!this.loadingService.loading()) {
      <router-outlet />
    } @else {
      <app-loading-dots
        class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 transform"
      />
    }
  </main>

  <app-footer />
</div>
