<app-navbar />
<app-toast />

<div class="flex flex-col md:flex-row">
  <app-profile-sidebar class="bg-white" />

  <div
    class="relative w-full overflow-x-hidden bg-white p-4 sm:mt-0 sm:h-[calc(100vh-80px)] sm:p-8"
    [ngClass]="!urlPaths.includes('add') ? 'mt-[70px]' : ''"
  >
    @if (!this.loadingService.loading()) {
      <router-outlet />
    } @else {
      <app-loading-dots class="absolute left-1/2 top-1/2 -translate-x-1/2" />
    }
  </div>
</div>
