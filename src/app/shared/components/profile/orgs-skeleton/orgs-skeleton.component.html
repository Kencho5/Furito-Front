<div class="mb-10 flex items-center justify-between">
  <div class="h-9 w-48 animate-pulse rounded-md bg-neutral-200"></div>
  <div class="flex items-center gap-2">
    <div
      class="h-[44px] w-[140px] animate-pulse rounded-2xl bg-yellow-200"
    ></div>
  </div>
</div>

<div class="flex gap-6">
  @for (item of [1, 2, 3, 4]; track item) {
    <div
      class="h-[215px] min-w-[342px] animate-pulse space-y-4 rounded-2xl border border-neutral-100 p-5 shadow-xs"
    >
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="h-12 w-12 rounded-full bg-neutral-200"></div>
          <div>
            <div class="mb-1 h-6 w-32 rounded-md bg-neutral-200"></div>
            <div class="h-4 w-20 rounded-md bg-neutral-200"></div>
          </div>
        </div>
        <div class="relative flex items-center gap-2">
          <div class="relative h-5 w-9 rounded-xl bg-neutral-200"></div>
          <div class="h-5 w-5 rounded-full bg-neutral-200"></div>
        </div>
      </div>

      <div class="h-px bg-neutral-100"></div>

      <div class="space-y-2.5">
        <div class="flex items-center">
          <div class="h-4 w-40 rounded-md bg-neutral-200"></div>
        </div>
        <div class="flex items-center">
          <div class="h-4 w-32 rounded-md bg-neutral-200"></div>
        </div>
        <div class="flex items-center">
          <div class="h-4 w-48 rounded-md bg-neutral-200"></div>
        </div>
      </div>
    </div>
  }
</div>
