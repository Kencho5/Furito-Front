<div class="w-[342px] rounded-2xl border border-neutral-100 p-5">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <app-image
        [src]="getLogoUrl(org.org_name, org.org_code)"
        customClass="h-12 w-12 rounded-full"
      />
      <div>
        <h1 class="font-semibold">{{ org.org_name }}</h1>
        <p class="subtext text-sm">{{ org.org_code }}</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <img src="/icons/profile/toggleOn.svg" />
    </div>
  </div>
</div>
