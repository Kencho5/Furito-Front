<div
  class="flex h-[calc(100vh-72px)] w-[300px] flex-col gap-6 border-r border-r-neutral-100 bg-white px-4 py-6 sm:h-[calc(100vh-80px)]"
>
  <div class="flex gap-3 rounded-2xl bg-neutral-50 p-4">
    <img src="/icons/userPaw.svg" width="44" height="44" alt="Avatar" />

    <div class="min-w-0">
      <p class="truncate font-semibold">გიორგი კენჭაძე</p>
      <p class="truncate text-sm font-normal text-neutral-500">
        giokenchadzegmail.com
      </p>
    </div>
  </div>

  <div class="w-full space-y-1.5">
    <a
      routerLink="organizations"
      [ngClass]="{
        'bg-orange-50 font-semibold text-orange-500':
          activeTab === '/profile/organizations',
      }"
      class="flex w-full items-center gap-2.5 rounded-2xl px-3 py-2.5"
      (click)="setActive('/profile/organizations')"
    >
      <svg
        width="20"
        height="18"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M6.5 4.25c-.41421 0-.75.33579-.75.75s.33579.75.75.75v-1.5Zm2 1.5c.41421 0 .75-.33579.75-.75s-.33579-.75-.75-.75v1.5Zm-2 2.5c-.41421 0-.75.33579-.75.75s.33579.75.75.75v-1.5Zm2 1.5c.41421 0 .75-.33579.75-.75s-.33579-.75-.75-.75v1.5Zm-2 2.5c-.41421 0-.75.3358-.75.75s.33579.75.75.75v-1.5Zm2 1.5c.41421 0 .75-.3358.75-.75s-.33579-.75-.75-.75v1.5ZM1 16.25c-.414214 0-.75.3358-.75.75s.335786.75.75.75v-1.5Zm18 1.5c.4142 0 .75-.3358.75-.75s-.3358-.75-.75-.75v1.5ZM3.75 17V2h-1.5v15h1.5ZM4 1.75h7V.25H4v1.5Zm7.25.25v15h1.5V2h-1.5ZM12 7.75h4v-1.5h-4v1.5Zm4.25.25v9h1.5V8h-1.5ZM6.5 5.75h2v-1.5h-2v1.5Zm0 4h2v-1.5h-2v1.5Zm0 4h2v-1.5h-2v1.5Zm-5.5 4h18v-1.5H1v1.5Zm15-10c.1381 0 .25.11193.25.25h1.5c0-.9665-.7835-1.75-1.75-1.75v1.5Zm-5-6c.1381 0 .25.11193.25.25h1.5c0-.9665-.7835-1.75-1.75-1.75v1.5ZM3.75 2c0-.13807.11193-.25.25-.25V.25c-.9665 0-1.75.7835-1.75 1.75h1.5Z"
          [attr.fill]="
            activeTab === '/profile/organizations' ? '#f97316' : '#6D6D6D'
          "
        />
      </svg>
      ჩემი ორგანიზაციები</a
    >
    <a
      routerLink="services"
      [ngClass]="{
        'bg-orange-50 font-semibold text-orange-500':
          activeTab === '/profile/services',
      }"
      class="flex w-full items-center gap-2.5 rounded-2xl px-3 py-2.5"
      (click)="setActive('/profile/services')"
    >
      <svg
        width="20"
        height="17"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M6 4v0c0-.93188 0-1.39782.15224-1.76537.20299-.49005.59234-.8794 1.08239-1.08239C7.60218 1 8.06812 1 9 1h2c.9319 0 1.3978 0 1.7654.15224.49.20299.8794.59234 1.0824 1.08239C14 2.60218 14 3.06812 14 4v0M1 10h18M7 16h6c2.8284 0 4.2426 0 5.1213-.8787C19 14.2426 19 12.8284 19 10v0c0-2.82843 0-4.24264-.8787-5.12132C17.2426 4 15.8284 4 13 4H7c-2.82843 0-4.24264 0-5.12132.87868C1 5.75736 1 7.17157 1 10v0c0 2.8284 0 4.2426.87868 5.1213C2.75736 16 4.17157 16 7 16Z"
          [attr.stroke]="
            activeTab === '/profile/services' ? '#f97316' : '#6D6D6D'
          "
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      ჩემი სერვისები</a
    >

    <a
      routerLink="posts"
      [ngClass]="{
        'bg-orange-50 font-semibold text-orange-500':
          activeTab === '/profile/posts',
      }"
      class="flex w-full items-center gap-2.5 rounded-2xl px-3 py-2.5"
      (click)="setActive('/profile/posts')"
    >
      <svg
        width="22"
        height="20"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M16 9c0 .27614-.2239.5-.5.5S15 9.27614 15 9s.2239-.5.5-.5.5.22386.5.5Z"
          fill="#6D6D6D"
        />
        <path
          d="m14.8569 14.6548.3536-.3536c.6667-.6666 1-1 1.4142-1 .4142 0 .7475.3334 1.4142 1L20 16.2623m-15-.0001 4.31801-4.318c.66667-.6667.99999-1 1.41419-1s.7476.3333 1.4142 1l3.4725 3.4724M17 1.5H9.5c-3.77124 0-5.65685 0-6.82843 1.17157C1.5 3.84315 1.5 5.72876 1.5 9.5v5.1548M16 9c0 .27614-.2239.5-.5.5S15 9.27614 15 9s.2239-.5.5-.5.5.22386.5.5Zm-5.5 9.8333h4c2.8284 0 4.2426 0 5.1213-.8786.8787-.8787.8787-2.2929.8787-5.1214V10.5c0-2.82843 0-4.24264-.8787-5.12132C18.7426 4.5 17.3284 4.5 14.5 4.5h-4c-2.82843 0-4.24264 0-5.12132.87868C4.5 6.25736 4.5 7.67157 4.5 10.5v2.3333c0 2.8285 0 4.2427.87868 5.1214.87868.8786 2.29289.8786 5.12132.8786Z"
          [attr.stroke]="activeTab === '/profile/posts' ? '#f97316' : '#6D6D6D'"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      ჩემი განცხადებები
      <p class="ml-auto rounded-lg bg-neutral-50 px-1.5 py-0.5 text-sm">10</p>
    </a>

    <a
      routerLink="cards"
      [ngClass]="{
        'bg-orange-50 font-semibold text-orange-500':
          activeTab === '/profile/cards',
      }"
      class="flex w-full items-center gap-2.5 rounded-2xl px-3 py-2.5"
      (click)="setActive('/profile/cards')"
    >
      <svg
        width="20"
        height="16"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M19 5H1m14 5h-3m-5 5h6c2.8284 0 4.2426 0 5.1213-.8787C19 13.2426 19 11.8284 19 9V7c0-2.82843 0-4.24264-.8787-5.12132C17.2426 1 15.8284 1 13 1H7c-2.82843 0-4.24264 0-5.12132.87868C1 2.75736 1 4.17157 1 7v2c0 2.8284 0 4.2426.87868 5.1213C2.75736 15 4.17157 15 7 15Z"
          [attr.stroke]="activeTab === '/profile/cards' ? '#f97316' : '#6D6D6D'"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      ბარათები</a
    >

    <a
      routerLink="info"
      [ngClass]="{
        'bg-orange-50 font-semibold text-orange-500':
          activeTab === '/profile/info',
      }"
      class="flex w-full items-center gap-2.5 rounded-2xl px-3 py-2.5"
      (click)="setActive('/profile/info')"
    >
      <svg
        width="18"
        height="20"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M17 16.5c0 1.933-3.5817 2.5-8 2.5-4.41828 0-8-.567-8-2.5S4.58172 12 9 12c4.4183 0 8 2.567 8 4.5ZM13 5c0 2.20914-1.7909 4-4 4-2.20914 0-4-1.79086-4-4s1.79086-4 4-4c2.2091 0 4 1.79086 4 4Z"
          [attr.stroke]="activeTab === '/profile/info' ? '#f97316' : '#6D6D6D'"
          stroke-width="1.5"
        />
      </svg>
      პირადი ინფორმაცია</a
    >
  </div>

  <button
    type="button"
    class="mt-auto flex items-center gap-2.5"
    (click)="authService.logout()"
  >
    <img src="/icons/logout.svg" alt="Log Out" />
    გასვლა
  </button>
</div>
