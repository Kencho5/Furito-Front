<div class="p-8">
  @if (orgs()?.total == 0) {
    @defer {
      <app-empty-orgs />
    }
  } @else if (loading()) {
    <app-orgs-skeleton />
  } @else {
    <div class="mb-10 flex items-center justify-between">
      <h1 class="text-3xl font-bold">{{ orgs()?.total }} ორგანიზაცია</h1>

      <a
        routerLink="add"
        class="flex max-w-[145px] items-center justify-center gap-2 rounded-2xl bg-yellow-400 px-4 py-2.5 font-semibold"
      >
        <svg
          stroke="#09244B"
          fill="#09244B"
          stroke-width="0"
          viewBox="0 0 512 512"
          height="18"
          width="18"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM232 344V280H168c-13.3 0-24-10.7-24-24s10.7-24 24-24h64V168c0-13.3 10.7-24 24-24s24 10.7 24 24v64h64c13.3 0 24 10.7 24 24s-10.7 24-24 24H280v64c0 13.3-10.7 24-24 24s-24-10.7-24-24z"
          ></path>
        </svg>
        დამატება
      </a>
    </div>

    <div class="flex flex-wrap gap-6">
      @for (org of orgs()?.orgs; track org.id) {
        <app-org-card [org]="org" />
      }
    </div>
  }
</div>
