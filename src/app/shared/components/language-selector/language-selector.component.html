<app-dropdown #dropdown>
  <button
    (click)="dropdown.toggle()"
    class="flex h-10 items-center rounded-2xl border border-neutral-300 p-2.5 text-neutral-400 sm:h-11 sm:px-3 sm:py-2.5"
  >
    <img src="/icons/global.svg" width="24" height="24" class="mr-1.5" />
    <span class="mr-0.5 text-sm font-semibold">
      {{ shortLabel }}
    </span>
    <img src="/icons/arrowDown.svg" width="20" height="20" />
  </button>

  <div
    dropDownContent
    class="absolute right-0 z-10 mt-6 w-72 origin-top-right rounded-2xl bg-white shadow-md"
    (click)="dropdown.toggle()"
  >
    <div class="space-y-2.5 p-2.5 font-normal">
      @for (language of LANGUAGES; track language.code) {
        <button
          (click)="changeLanguage(language.code)"
          [ngClass]="{
            'flex w-full items-center justify-between rounded-lg p-2.5 text-left transition hover:bg-neutral-100': true,
            'bg-neutral-100 font-medium':
              languageService.currentLang === language.code,
          }"
        >
          {{ language.label }}
          @if (languageService.currentLang === language.code) {
            <img src="/icons/checkOrange.svg" width="20" height="20" />
          }
        </button>
      }
    </div>
  </div>
</app-dropdown>
