<button type="button" (click)="toggle()">
  @if (!showPassword) {
    <img
      src="/icons/eyeOpen.svg"
      class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer"
    />
  } @else {
    <img
      src="/icons/eyeClosed.svg"
      class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer"
    />
  }
</button>
