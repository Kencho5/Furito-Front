<form
  class="relative flex w-full max-w-[550px] flex-col gap-4 rounded-3xl py-8 sm:gap-6 sm:bg-white sm:px-10 sm:shadow-sm"
  [formGroup]="authForm"
  (ngSubmit)="submitForm.emit()"
>
  <h1 class="mb-4 text-center text-2xl font-bold sm:text-3xl">
    {{ authTitle }}
  </h1>

  <ng-content />
</form>
