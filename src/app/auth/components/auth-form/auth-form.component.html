<form
  class="relative flex w-full max-w-[550px] flex-col gap-6 overflow-hidden rounded-3xl bg-white px-4 py-8 shadow-sm sm:px-10"
  [formGroup]="loginForm"
  (ngSubmit)="onSubmit()"
>
  <app-circles />
  <h1 class="mb-4 text-center text-2xl font-bold sm:text-3xl">
    {{ authTitle }}
  </h1>

  <ng-content />
</form>
