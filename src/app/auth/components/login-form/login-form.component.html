<app-auth-form
  [authTitle]="'AUTH.login' | translate"
  [authForm]="loginForm"
  (submitForm)="onSubmit()"
>
  <app-input
    [control]="loginForm.controls.email"
    [type]="'text'"
    [placeholder]="'AUTH.email' | translate"
  />

  <div class="relative">
    <app-input
      [control]="loginForm.controls.password"
      [type]="showPassword ? 'text' : 'password'"
      [placeholder]="'AUTH.password' | translate"
    />

    <app-password-toggle (showPasswordChange)="showPassword = $event" />
  </div>

  <div class="text-right text-sm text-neutral-900">
    <a routerLink="../reset-password">{{
      "AUTH.reset_password" | translate
    }}</a>
  </div>

  <button
    type="submit"
    class="rounded-2xl bg-yellow-400 px-5 py-2.5 text-base font-semibold text-neutral-900"
  >
    {{ "AUTH.submit" | translate }}
  </button>
</app-auth-form>
