<app-auth-form
  [authTitle]="'NAVBAR.login' | translate"
  [authForm]="loginForm"
  [onSubmit]="onSubmit"
>
  <app-input [type]="'text'" formControlName="email" [placeholder]="'Email'" />
  <app-input
    [type]="'password'"
    formControlName="password"
    [placeholder]="'Password'"
  />
</app-auth-form>
