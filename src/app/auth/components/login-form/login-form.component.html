<app-auth-form
  [authTitle]="'AUTH.login' | translate"
  [authForm]="loginForm"
  (submitForm)="onSubmit()"
>
  <app-input
    [control]="loginForm.controls.email"
    [type]="'text'"
    [placeholder]="'AUTH.email' | translate"
    [error]="submitted && loginForm.controls.email.invalid"
  />

  <div class="relative">
    <app-input
      [control]="loginForm.controls.password"
      [type]="showPassword ? 'text' : 'password'"
      [placeholder]="'AUTH.password' | translate"
      [error]="submitted && loginForm.controls.password.invalid"
    />

    <app-password-toggle (showPasswordChange)="showPassword = $event" />
  </div>

  @if (authError) {
    <div class="text-red-500 mb-4 text-sm">
      {{ authError | translate }}
    </div>
  }

  <div class="text-right text-sm text-neutral-900">
    <a routerLink="../reset-password">{{
      "AUTH.reset_password" | translate
    }}</a>
  </div>

  <button
    type="submit"
    class="rounded-2xl bg-yellow-400 px-5 py-2.5 text-base font-semibold text-neutral-900"
  >
    {{ "AUTH.submit" | translate }}
  </button>

  <a
    routerLink="../register"
    class="text-center text-sm font-normal text-neutral-400"
  >
    {{ "AUTH.no_account" | translate }}
    <span class="text-orange-500">
      {{ "AUTH.register" | translate }}
    </span>
  </a>
</app-auth-form>
