<div class="px-4 py-8 sm:px-20 sm:py-16">
  <div
    class="flex flex-col items-center justify-between xl:flex-row xl:items-start"
  >
    <div class="relative space-y-5 text-center xl:text-left">
      <h1 class="text-4xl font-bold leading-tight xl:text-6xl">
        იპოვე ოჯახის <br />
        <span class="font-bold text-orange-500">ახალი მეგობარი</span>
      </h1>
      <p class="max-w-[485px] font-normal text-neutral-500 xl:text-lg">
        შემოგვიერთდი და იპოვე შენი ახალი საუკეთესო მეგობარი ჩვენთან
      </p>

      <form [formGroup]="searchForm" (ngSubmit)="search()" class="space-y-6">
        <div class="relative">
          <img
            src="/icons/home/search.svg"
            class="absolute left-4 top-1/2 -translate-y-1/2"
          />
          <input
            type="text"
            formControlName="text"
            placeholder="მაგ: ცხოველის ჯიში"
            class="h-[60px] w-full rounded-3xl border-[1.5px] border-yellow-300 px-1.5 py-2.5 pl-14 font-normal text-neutral-900 outline-none placeholder:text-neutral-400 sm:text-lg"
          />
        </div>

        <button
          type="submit"
          value="ძებნა"
          class="flex h-[60px] w-full items-center justify-center rounded-3xl bg-yellow-400 px-5 py-3 font-bold sm:text-lg"
        >
          ძებნა
        </button>
      </form>

      <app-image
        src="/icons/home/curlyArrow.svg"
        width="114"
        height="88"
        class="absolute -right-36 top-40 hidden xl:block"
      />
    </div>

    <app-image src="/home/pets.png" width="593" height="560" />
  </div>
</div>
