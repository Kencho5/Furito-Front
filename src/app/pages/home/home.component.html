<div class="mt-10 text-center">
  <h1
    class="text-2xl font-bold"
    [ngClass]="{
      'text-lime-500': isLoggedIn,
      'text-orange-500': !isLoggedIn,
    }"
  >
    {{
      isLoggedIn
        ? ("HOME.authorized" | translate)
        : ("HOME.not_authorized" | translate)
    }}
  </h1>
</div>
